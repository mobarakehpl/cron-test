name: Mobarakeh Library Browser Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mpl-browser-sync.yml'
      - 'scripts/mpl-browser-sync.mjs'
  schedule:
    # GitHub Actions uses UTC. The site's own handler verifies the six-hour due window.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobarakeh-library-browser-sync
  cancel-in-progress: false

jobs:
  browser-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Open the website and trigger browser sync
        env:
          MPL_SITE_URL: ${{ vars.MPL_SITE_URL || 'https://mobarakehpl.ir/' }}
        run: node scripts/mpl-browser-sync.mjs
