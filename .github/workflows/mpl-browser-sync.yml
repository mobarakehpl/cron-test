name: Mobarakeh Library Browser Sync - TLS Workaround Test

on:
  # GitHub cron uses UTC. These times correspond to 06:43, 12:43, 18:43,
  # and 00:43 in Iran (UTC+03:30). Scheduled jobs can start later than requested.
  schedule:
    - cron: '13 3,9,15,21 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/mpl-browser-sync.yml'
      - 'scripts/mpl-browser-sync.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobarakeh-library-browser-sync-test
  cancel-in-progress: false

jobs:
  browser-sync-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Open public site in Chromium and wait for WordPress sync response
        env:
          MPL_SITE_URL: ${{ vars.MPL_SITE_URL || 'https://mobarakehpl.ir/' }}
        run: xvfb-run -a node scripts/mpl-browser-sync.mjs
